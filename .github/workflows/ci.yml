name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run unit tests
        run: ./mvnw -B verify

  external-example:
    name: External Spring application (adapter SDK)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install the adapter SDK and its reactor dependencies
        run: ./mvnw -B -pl commitgap-adapter -am install
      - name: Test and package the separate Spring application
        run: ./mvnw -B -f examples/external-spring/pom.xml verify
      - name: Run measured loss, duplicate and safe examples
        run: java -jar examples/external-spring/target/external-spring-example-0.1.0-SNAPSHOT.jar

  integration:
    name: Integration scenarios (Docker, Linux)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Docker version
        run: docker version
      - name: Integration tests against real PostgreSQL, RabbitMQ and Toxiproxy containers
        run: ./mvnw -B -Pit verify
      - name: Launcher end to end (doctor, demo on two scenarios)
        run: |
          ./commitgap doctor
          ./commitgap demo --scenario happy-path --scenario crash-after-commit
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: commitgap-reports
          path: |
            .commitgap/runs/**/report.*
            .commitgap/runs/**/manifest.json
            .commitgap/runs/**/timeline.jsonl
            .commitgap/runs/**/logs/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 7

  launchers:
    name: Launchers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker is not available on the hosted Windows and macOS runners for Linux containers, so these
      # jobs check that the launchers build and start the CLI; the lab itself runs in the integration job.
      - name: Bash launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./commitgap --version
          ./commitgap scenarios list
          set +e
          ./commitgap run --scenario relay-confirm-gap --strategy naive-dual-write
          code=$?
          set -e
          test "$code" -eq 2
      - name: PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\commitgap.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\commitgap.ps1 scenarios list
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\commitgap.ps1 run --scenario relay-confirm-gap --strategy naive-dual-write
          if ($LASTEXITCODE -ne 2) { Write-Error "expected exit code 2, got $LASTEXITCODE"; exit 1 }
          exit 0
      - name: cmd wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: commitgap.cmd --version
      - name: Release package layout
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./mvnw -B -q -Pdist -DskipTests package
          mkdir -p "$RUNNER_TEMP/dist" && unzip -q commitgap-cli/target/commitgap-*-dist.zip -d "$RUNNER_TEMP/dist"
          "$RUNNER_TEMP"/dist/commitgap-*/commitgap --version
