# The publisher sends one event three times with the same event id. Two consumer workers run
# concurrently, so duplicates can be processed at the same moment.
schemaVersion: 1
id: duplicate-delivery
description: Publish the same event three times with the same event id to two concurrent consumer workers.
workload:
  seed: 42
  orders: 20
  quantityPerOrder: 1
  initialStock: 100
  rollbackEvery: 7
  consumerWorkers: 2
fault:
  target: publisher
  action: duplicate-publish
  occurrence: 5
  copies: 3
recovery:
  action: none
observation:
  timeoutSeconds: 30
assertions:
  - committed-order-has-business-effect
  - stock-changed-once-per-event
  - rolled-back-order-has-no-effect
  - stock-matches-committed-orders
  - dedup-record-matches-business-effect
  - no-pending-work-after-recovery
expectedByStrategy:
  naive-dual-write: VIOLATION_OBSERVED
  transactional-outbox: VIOLATION_OBSERVED
  outbox-idempotent: CONSISTENT
