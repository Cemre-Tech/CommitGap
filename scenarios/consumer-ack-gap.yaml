# The consumer is SIGKILLed after its business transaction committed and before it acknowledged
# the delivery. The broker redelivers the message to the restarted consumer.
schemaVersion: 1
id: consumer-ack-gap
description: Kill the consumer after its stock change commits, before it acknowledges the message.
workload:
  seed: 42
  orders: 20
  quantityPerOrder: 1
  initialStock: 100
  rollbackEvery: 7
fault:
  target: consumer
  checkpoint: consumer.after-business-commit-before-ack
  action: kill
  occurrence: 5
recovery:
  action: restart
observation:
  timeoutSeconds: 30
assertions:
  - committed-order-has-business-effect
  - stock-changed-once-per-event
  - rolled-back-order-has-no-effect
  - stock-matches-committed-orders
  - dedup-record-matches-business-effect
  - no-pending-work-after-recovery
expectedByStrategy:
  naive-dual-write: VIOLATION_OBSERVED
  transactional-outbox: VIOLATION_OBSERVED
  outbox-idempotent: CONSISTENT
