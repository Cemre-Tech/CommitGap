schemaVersion: 1
id: relay-lock-crash
description: Kill the single relay worker while its transaction holds an outbox row lock, before publishing.
workload:
  seed: 42
  orders: 20
  quantityPerOrder: 1
  initialStock: 100
  rollbackEvery: 7
fault:
  target: relay
  checkpoint: relay.after-row-lock-before-publish
  action: kill
  occurrence: 5
recovery:
  action: restart
observation:
  timeoutSeconds: 30
assertions:
  - committed-order-has-business-effect
  - stock-changed-once-per-event
  - rolled-back-order-has-no-effect
  - stock-matches-committed-orders
  - dedup-record-matches-business-effect
  - no-pending-work-after-recovery
expectedByStrategy:
  naive-dual-write: NOT_APPLICABLE
  transactional-outbox: CONSISTENT
  outbox-idempotent: CONSISTENT
