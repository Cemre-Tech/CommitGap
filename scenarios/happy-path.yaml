# Control scenario. If any strategy is not CONSISTENT here, do not trust the other comparisons:
# the lab itself is not working as intended on this machine.
schemaVersion: 1
id: happy-path
description: All strategies process the normal workload without any fault.
workload:
  seed: 42
  orders: 20
  quantityPerOrder: 1
  initialStock: 100
  rollbackEvery: 7
observation:
  timeoutSeconds: 30
assertions:
  - committed-order-has-business-effect
  - stock-changed-once-per-event
  - rolled-back-order-has-no-effect
  - stock-matches-committed-orders
  - dedup-record-matches-business-effect
  - no-pending-work-after-recovery
expectedByStrategy:
  naive-dual-write: CONSISTENT
  transactional-outbox: CONSISTENT
  outbox-idempotent: CONSISTENT
